[package]
name = "agent-leash-near"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
unit-testing = ["near-sdk/unit-testing"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
resolver = "2"

[dev-dependencies.near-workspaces]
version = "0.24.0"
default-features = false
features = ["rustls", "unstable"]

[dev-dependencies.tokio]
version = "1.54.1"
features = ["macros", "rt-multi-thread"]
